<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Quiz PWA</title>
    <link rel="manifest" href="manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
    <style>
        body { font-family: sans-serif; background-color: #1a1a2e; color: white; text-align: center; padding: 20px; }
        .logos-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin: 20px auto; max-width: 400px; }
        .club-card { background: #16213e; padding: 10px; border-radius: 10px; border: 2px solid #e94560; }
        .club-card img { width: 70px; height: 70px; object-fit: contain; }
        input { width: 80%; padding: 12px; border-radius: 5px; border: none; font-size: 16px; }
        #suggestions { background: white; color: black; max-width: 80%; margin: 0 auto; border-radius: 0 0 5px 5px; text-align: left; }
        .suggestion-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; }
        .score-board { margin: 20px; font-size: 20px; color: #e94560; }
        button { padding: 10px 20px; background: #e94560; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Football Quiz</h1>
    <div class="logos-container" id="logos"></div>
    <input type="text" id="playerInput" placeholder="Գրիր ֆուտբոլիստի անուն..." autocomplete="off">
    <div id="suggestions"></div>
    <div class="score-board">Միավորներ: <span id="score">0</span></div>
    <button onclick="nextRound()">Հաջորդ փուլ</button>

<script>
    const clubs = [
        { id: 1, name: "Real Madrid", logo: "https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg" },
        { id: 2, name: "Barcelona", logo: "https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona.svg" },
        { id: 3, name: "Man Utd", logo: "https://upload.wikimedia.org/wikipedia/en/7/7a/Manchester_United_FC_crest.svg" },
        { id: 4, name: "AC Milan", logo: "https://upload.wikimedia.org/wikipedia/commons/d/d1/AC_Milan.svg" },
        { id: 5, name: "PSG", logo: "https://upload.wikimedia.org/wikipedia/en/a/a7/Paris_Saint-Germain_F.C..svg" },
        { id: 6, name: "Juventus", logo: "https://upload.wikimedia.org/wikipedia/commons/b/bc/Juventus_FC_2017_icon_%28black%29.svg" },
        { id: 7, name: "Bayern", logo: "https://upload.wikimedia.org/wikipedia/commons/1/1b/FC_Bayern_M%C3%BCnchen_logo_%282017%29.svg" },
        { id: 8, name: "Inter", logo: "https://upload.wikimedia.org/wikipedia/commons/0/05/FC_Internazionale_Milano_2021.svg" }
    ];

    const players = [
        { name: "Cristiano Ronaldo", clubs: [1, 3, 6] },
        { name: "Lionel Messi", clubs: [2, 5] },
        { name: "Zlatan Ibrahimovic", clubs: [2, 4, 5, 6, 8, 3] },
        { name: "Ronaldinho", clubs: [2, 4, 5] },
        { name: "David Beckham", clubs: [1, 3, 4, 5] },
        { name: "Sergio Ramos", clubs: [1, 5] }
    ];

    let currentClubs = [];
    let totalScore = 0;

    function nextRound() {
        currentClubs = [...clubs].sort(() => 0.5 - Math.random()).slice(0, 4);
        const logosDiv = document.getElementById('logos');
        logosDiv.innerHTML = '';
        currentClubs.forEach(club => {
            logosDiv.innerHTML += `<div class="club-card"><img src="${club.logo}"><br>${club.name}</div>`;
        });
    }

    const input = document.getElementById('playerInput');
    const suggestionsDiv = document.getElementById('suggestions');

    input.addEventListener('input', () => {
        const val = input.value.toLowerCase();
        suggestionsDiv.innerHTML = '';
        if (!val) return;
        const filtered = players.filter(p => p.name.toLowerCase().includes(val));
        filtered.forEach(p => {
            const div = document.createElement('div');
            div.innerHTML = p.name;
            div.className = 'suggestion-item';
            div.onclick = () => { checkPlayer(p); suggestionsDiv.innerHTML = ''; input.value = ''; };
            suggestionsDiv.appendChild(div);
        });
    });

    function checkPlayer(player) {
        let points = 0;
        currentClubs.forEach(club => { if (player.clubs.includes(club.id)) points++; });
        if (points > 0) {
            totalScore += points;
            document.getElementById('score').innerText = totalScore;
            alert("Ճիշտ է! +" + points);
            nextRound();
        } else { alert("Սխալ է!"); }
    }
    nextRound();
</script>
</body>
</html>
