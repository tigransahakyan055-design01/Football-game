<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Quiz</title>
    
    <!-- 1. Նախ բեռնում ենք տվյալների ֆայլերը -->
    <script src="clubs.js"></script>
    <script src="players.js"></script>

    <style>
        /* Այստեղ քո դիզայնի կոդն է (body, .container, և այլն) */
        body { font-family: sans-serif; background-color: #1a1a2e; color: white; text-align: center; }
        .logos-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 20px; }
        .logo-box { background: white; padding: 10px; border-radius: 10px; height: 100px; display: flex; align-items: center; justify-content: center; }
        .logo-box img { max-width: 80px; max-height: 80px; }
        #suggestions { background: white; color: black; position: absolute; width: 80%; left: 10%; z-index: 100; max-height: 150px; overflow-y: auto; display: none; text-align: left; }
        .suggestion-item { padding: 10px; border-bottom: 1px solid #ccc; cursor: pointer; }
        input { padding: 10px; width: 80%; margin-top: 20px; }
        #score { font-size: 24px; margin: 20px; color: #e94560; }
    </style>
</head>
<body>

    <div id="score">Միավորներ: 0</div>
    
    <div class="logos-container" id="logos"></div>

    <div style="position: relative;">
        <input type="text" id="playerInput" placeholder="Գրիր խաղացողի անունը..." autocomplete="off">
        <div id="suggestions"></div>
    </div>

    <br>
    <button onclick="checkAnswer()" style="padding: 10px 20px; background: #e94560; color: white; border: none; margin-top: 10px;">Ստուգել</button>
    <button onclick="nextRound()" style="padding: 10px 20px; background: #0f3460; color: white; border: none;">Հաջորդը</button>

    <div id="message" style="margin-top: 20px; font-weight: bold;"></div>

<script>
    // ԱՅՍՏԵՂ ԱՅԼԵՎՍ ՉՊԵՏՔ Է ԼԻՆԵՆ clubsData կամ playersData փոփոխականները
    // Դրանք ավտոմատ կգան clubs.js և players.js ֆայլերից

    let currentClubs = [];
    let score = 0;

    const playerInput = document.getElementById('playerInput');
    const suggestionsDiv = document.getElementById('suggestions');

    // Autocomplete logic
    playerInput.addEventListener('input', function() {
        const val = this.value.toLowerCase();
        suggestionsDiv.innerHTML = '';
        if (!val) { suggestionsDiv.style.display = 'none'; return; }

        const filtered = playersData.filter(p => p.name.toLowerCase().includes(val));
        filtered.forEach(player => {
            const div = document.createElement('div');
            div.innerHTML = player.name;
            div.className = 'suggestion-item';
            div.onclick = function() {
                playerInput.value = player.name;
                suggestionsDiv.style.display = 'none';
            };
            suggestionsDiv.appendChild(div);
        });
        suggestionsDiv.style.display = filtered.length > 0 ? 'block' : 'none';
    });

    function nextRound() {
        document.getElementById('message').innerText = "";
        playerInput.value = "";
        const logosDiv = document.getElementById('logos');
        logosDiv.innerHTML = "";

        // Ընտրում ենք 4 պատահական ակումբ
        let shuffled = [...clubsData].sort(() => 0.5 - Math.random());
        currentClubs = shuffled.slice(0, 4);

        currentClubs.forEach(club => {
            const div = document.createElement('div');
            div.className = 'logo-box';
            div.innerHTML = `<img src="${club.logo}">`;
            logosDiv.appendChild(div);
        });
    }

    function checkAnswer() {
        const name = playerInput.value.trim();
        const player = playersData.find(p => p.name.toLowerCase() === name.toLowerCase());
        const msg = document.getElementById('message');

        if (player) {
            let matches = 0;
            currentClubs.forEach(club => {
                if (player.clubs.includes(club.name)) {
                    matches++;
                }
            });

            if (matches > 0) {
                score += matches;
                msg.style.color = "#4caf50";
                msg.innerText = `Ճիշտ է! ${player.name}-ը խաղացել է այս թիմերից ${matches}-ում: +${matches} միավոր`;
                document.getElementById('score').innerText = `Միավորներ: ${score}`;
            } else {
                msg.style.color = "#ff4d4d";
                msg.innerText = "Այս խաղացողը չի խաղացել նշված թիմերից ոչ մեկում:";
            }
        } else {
            msg.style.color = "#ff4d4d";
            msg.innerText = "Խաղացողը չգտնվեց:";
        }
    }

    // Խաղը սկսելու համար
    window.onload = nextRound;
</script>

</body>
</html>
