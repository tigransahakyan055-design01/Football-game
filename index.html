<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Game</title>
    <script src="clubs.js"></script>
    <script src="players.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #1a1a2e; color: white; text-align: center; padding: 10px; }
        .logos-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-width: 400px; margin: 20px auto; }
        .logo-box { background: white; padding: 10px; border-radius: 10px; height: 100px; display: flex; align-items: center; justify-content: center; color: black; font-weight: bold; }
        .logo-box img { max-width: 100%; max-height: 100%; }
        input { padding: 12px; width: 80%; border-radius: 8px; margin-bottom: 10px; font-size: 16px; }
        #suggestions { background: white; color: black; position: absolute; left: 10%; right: 10%; max-height: 150px; overflow-y: auto; z-index: 100; text-align: left; }
        .suggestion-item { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; }
        button { padding: 12px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 16px; font-weight: bold; }
        #score-view { font-size: 20px; margin-bottom: 10px; color: #e94560; }
    </style>
</head>
<body>

    <div id="score-view">Միավորներ: 0</div>
    <div class="logos-container" id="logos"></div>

    <div style="position: relative;">
        <input type="text" id="playerInput" placeholder="Գրիր խաղացողի անունը..." autocomplete="off">
        <div id="suggestions"></div>
    </div>

    <div style="margin-top: 10px;">
        <button onclick="checkAnswer()" style="background: #e94560; color: white;">Ստուգել</button>
        <button onclick="nextRound()" style="background: #0f3460; color: white;">Հաջորդը</button>
    </div>
    
    <div id="message" style="margin-top: 15px; font-weight: bold;"></div>

<script>
    let score = 0;
    let currentClubs = [];

    const playerInput = document.getElementById('playerInput');
    const suggestionsDiv = document.getElementById('suggestions');

    playerInput.addEventListener('input', function() {
        const val = this.value.toLowerCase();
        suggestionsDiv.innerHTML = '';
        if (val.length < 2) { suggestionsDiv.style.display = 'none'; return; }
        
        const filtered = playersData.filter(p => p.name.toLowerCase().includes(val)).slice(0, 5);
        filtered.forEach(p => {
            const div = document.createElement('div');
            div.className = 'suggestion-item';
            div.innerText = p.name;
            div.onclick = () => { playerInput.value = p.name; suggestionsDiv.style.display = 'none'; };
            suggestionsDiv.appendChild(div);
        });
        suggestionsDiv.style.display = filtered.length > 0 ? 'block' : 'none';
    });

    function nextRound() {
        document.getElementById('message').innerText = "";
        playerInput.value = "";
        const logosDiv = document.getElementById('logos');
        logosDiv.innerHTML = "";

        // Ընտրում ենք 4 թիմ
        let shuffled = [...clubsData].sort(() => 0.5 - Math.random());
        currentClubs = shuffled.slice(0, 4);

        currentClubs.forEach(club => {
            const div = document.createElement('div');
            div.className = 'logo-box';
            const img = document.createElement('img');
            img.src = club.logo;
            img.alt = club.name;
            // Եթե նկարը չբեռնվի, գրել անունը
            img.onerror = function() {
                this.style.display = 'none';
                div.innerText = club.name;
            };
            div.appendChild(img);
            logosDiv.appendChild(div);
        });
    }

    function checkAnswer() {
        const val = playerInput.value.trim().toLowerCase();
        const player = playersData.find(p => p.name.toLowerCase() === val);
        const msg = document.getElementById('message');

        if (player) {
            let matches = currentClubs.filter(c => player.clubs.includes(c.name)).length;
            if (matches > 0) {
                score += matches;
                document.getElementById('score-view').innerText = `Միավորներ: ${score}`;
                msg.style.color = "#4caf50";
                msg.innerText = "Ճիշտ է! +" + matches;
            } else {
                msg.style.color = "#ff4d4d";
                msg.innerText = "Ոչ մի համընկնում:";
            }
        } else {
            msg.style.color = "#ff4d4d";
            msg.innerText = "Չգտնվեց:";
        }
    }

    // Սկսել խաղը, երբ տվյալները բեռնվեն
    window.onload = () => {
        if (typeof clubsData !== 'undefined') {
            nextRound();
        } else {
            alert("Տվյալները չեն բեռնվել: Ստուգեք clubs.js և players.js ֆայլերը:");
        }
    };
</script>
</body>
</html>
