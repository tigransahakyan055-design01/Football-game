<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Quiz</title>
    <script src="clubs.js"></script>
    <script src="players.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #1a1a2e; color: white; text-align: center; padding: 20px; }
        .logos-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin: 20px auto; max-width: 500px; }
        .logo-box { background: white; padding: 10px; border-radius: 10px; height: 110px; display: flex; align-items: center; justify-content: center; overflow: hidden; color: black; font-weight: bold; position: relative; }
        .logo-box img { max-width: 90%; max-height: 90%; object-fit: contain; }
        .team-name-fallback { position: absolute; font-size: 14px; text-align: center; padding: 5px; }
        input { padding: 12px; width: 80%; border-radius: 8px; border: none; margin: 10px 0; }
        button { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; margin: 5px; }
        #suggestions { background: white; color: black; position: absolute; left: 10%; right: 10%; max-height: 200px; overflow-y: auto; z-index: 100; text-align: left; display: none; }
        .suggestion-item { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; }
        #score-display { font-size: 20px; background: #e94560; padding: 10px; border-radius: 20px; display: inline-block; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="score-display">Միավորներ: 0</div>
    <div class="logos-container" id="logos"></div>

    <div style="position: relative;">
        <input type="text" id="playerInput" placeholder="Գրիր խաղացողի անունը..." autocomplete="off">
        <div id="suggestions"></div>
    </div>

    <button onclick="checkAnswer()" style="background: #e94560; color: white;">Ստուգել</button>
    <button onclick="nextRound()" style="background: #0f3460; color: white;">Հաջորդը</button>
    <div id="message" style="margin-top: 15px; min-height: 20px;"></div>

<script>
    let score = parseInt(localStorage.getItem('football_score')) || 0;
    document.getElementById('score-display').innerText = `Միավորներ: ${score}`;
    let currentClubs = [];

    const playerInput = document.getElementById('playerInput');
    const suggestionsDiv = document.getElementById('suggestions');

    playerInput.addEventListener('input', function() {
        const val = this.value.toLowerCase();
        suggestionsDiv.innerHTML = '';
        if (val.length < 2) { suggestionsDiv.style.display = 'none'; return; }
        const filtered = playersData.filter(p => p.name.toLowerCase().includes(val)).slice(0, 10);
